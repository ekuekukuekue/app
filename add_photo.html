<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>写真を追加</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>写真を追加</h1></header>

  <form id="photoForm">
    <label>名前: <input type="text" id="photoName" required></label><br>
    <label>説明: <textarea id="photoDesc"></textarea></label><br>
    <label>画像: <input type="file" id="photoImage" accept="image/*" required></label><br>
    <button type="submit">登録</button>
  </form>

  <p id="status"></p>

  <button onclick="location.href='zukan_list.html'">図鑑一覧に戻る</button>

  <script>
    document.getElementById('photoForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('photoName').value;
      const description = document.getElementById('photoDesc').value;
      const imageFile = document.getElementById('photoImage').files[0];

      if (!imageFile) {
        alert("画像を選んでください");
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        // GPS取得
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            const photo = {
              name,
              description,
              image: reader.result,
              lat,
              lng
            };

            savePhoto(photo);
          }, (err) => {
            alert("位置情報を取得できませんでした");
            const photo = {
              name,
              description,
              image: reader.result,
              lat: null,
              lng: null
            };
            savePhoto(photo);
          });
        } else {
          alert("この端末では位置情報が使えません");
        }
      };
      reader.readAsDataURL(imageFile);
    });

    function savePhoto(photo) {
      const zukanId = localStorage.getItem('currentZukanId');
      const zukan = getZukanById(zukanId);

      if (!zukan.photos) {
        zukan.photos = [];
      }
      zukan.photos.push(photo);

      updateZukan(zukanId, zukan);
      document.getElementById('status').textContent = "登録しました！";
    }
  </script>
</body>
</html>
