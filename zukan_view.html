<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>図鑑を見る</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- exif.js（script.js より前に読み込む！） -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>図鑑の中身</h1></header>
  <div id="photoList" class="photo-list"></div>
  <button onclick="location.href='zukan_list.html'">図鑑一覧に戻る</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const zukanId = localStorage.getItem('currentZukanId');
      const zukan = getZukanById(zukanId); // script.js 内にある想定
      const photoList = document.getElementById('photoList');

      if (!zukan) {
        photoList.innerHTML = '<p>図鑑が見つかりません。</p>';
        return;
      }

      if (!zukan.photos || zukan.photos.length === 0) {
        photoList.innerHTML = '<p>写真がまだ登録されていません。</p>';
      } else {
        zukan.photos.forEach((photo, index) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <img src="${photo.image}" alt="${photo.name}" id="photo-${index}"><br>
            <strong>${photo.name}</strong><br>
            <p>${photo.description}</p>
            <div id="map-${index}" style="height:200px; width:100%; margin-top:10px;"></div>
          `;
          photoList.appendChild(card);

          // EXIF から GPS を取得
          const img = document.getElementById(`photo-${index}`);
          EXIF.getData(img, function() {
            const lat = EXIF.getTag(this, "GPSLatitude");
            const latRef = EXIF.getTag(this, "GPSLatitudeRef");
            const lng = EXIF.getTag(this, "GPSLongitude");
            const lngRef = EXIF.getTag(this, "GPSLongitudeRef");

            if (lat && lng) {
              const latDec = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
              const lngDec = convertDMSToDD(lng[0], lng[1], lng[2], lngRef);

              const map = L.map(`map-${index}`).setView([latDec, lngDec], 13);
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
              }).addTo(map);

              L.marker([latDec, lngDec]).addTo(map)
                .bindPopup(photo.name || "撮影場所")
                .openPopup();
            } else {
              document.getElementById(`map-${index}`).innerHTML =
                "<p style='color:gray;'>位置情報なし</p>";
            }
          });
        });
      }
    });

    // 度分秒 → 10進数
    function convertDMSToDD(degrees, minutes, seconds, direction) {
      let dd = degrees + minutes/60 + seconds/(60*60);
      if (direction === "S" || direction === "W") {
        dd = dd * -1;
      }
      return dd;
    }
  </script>
</body>
</html>
