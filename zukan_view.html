<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>図鑑を見る</title>
  <link rel="stylesheet" href="style.css" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>図鑑の中身</h1></header>
  <div id="photoList" class="photo-list"></div>
  <button id="btnBack">図鑑一覧に戻る</button>
  <button id="btnHome" style="display:none;">スタート画面に戻る</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const photoList = document.getElementById('photoList');
      const btnBack = document.getElementById('btnBack');
      const btnHome = document.getElementById('btnHome');

      // URLから図鑑IDを取得
      const params = new URLSearchParams(location.search);
      const sharedZukanId = params.get('id');

      let zukanId;
      if (sharedZukanId) {
          zukanId = sharedZukanId;
          // 共有されたページでは「戻る」ボタンを非表示にし、「スタートに戻る」を表示
          btnBack.style.display = 'none';
          btnHome.style.display = 'inline';
      } else {
          zukanId = localStorage.getItem('currentZukanId');
          // 通常の閲覧ページでは「スタートに戻る」を非表示
          btnHome.style.display = 'none';
      }

      const zukan = getZukanById(zukanId);

      if (!zukan) {
        photoList.innerHTML = '<p>図鑑が見つかりません。</p>';
        return;
      }

      document.querySelector('header h1').textContent = `${zukan.name}`;

      if (!zukan.photos || zukan.photos.length === 0) {
        photoList.innerHTML = '<p>写真がまだ登録されていません。</p>';
      } else {
        zukan.photos.forEach((photo, index) => {
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.innerHTML = `
            <h3>${photo.name}</h3>
            <p>${photo.description || ''}</p>
            <img src="${photo.image}" alt="${photo.name}" width="200" id="photo-${index}">
            <div id="map-${index}" style="height:200px; margin-top:10px;"></div>
          `;
          photoList.appendChild(card);

          if (photo.lat && photo.lng) {
            const map = L.map(`map-${index}`).setView([photo.lat, photo.lng], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            L.marker([photo.lat, photo.lng]).addTo(map)
              .bindPopup(photo.name || "撮影場所")
              .openPopup();
          } else {
            document.getElementById(`map-${index}`).innerHTML =
              "<p style='color:gray;'>位置情報なし</p>";
          }
        });
      }
      
      btnBack.onclick = () => {
          location.href = 'zukan_list.html';
      };
      
      btnHome.onclick = () => {
          location.href = 'index.html';
      };
    });
  </script>
</body>
</html>
