<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>写真の情報を入力</title>
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdn.jsdelivr.net/npm/phash-js@0.3.0/dist/phash.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-hamming-distance@1.0.0/dist/js-hamming-distance.min.js"></script>

  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>写真の情報を入力</h1></header>

  <img id="displayImage" src="" alt="プレビュー" style="max-width: 100%;" />

  <div id="duplicateCheckResult"></div>

  <label for="photoName">名前：</label>
  <input type="text" id="photoName" />

  <label for="photoDescription">説明：</label>
  <textarea id="photoDescription"></textarea>

  <button id="btnSave">登録</button>
  <button id="btnBack">戻る</button>

  <script>
    const image = document.getElementById('displayImage');
    const nameInput = document.getElementById('photoName');
    const descInput = document.getElementById('photoDescription');
    const btnSave = document.getElementById('btnSave');
    const btnBack = document.getElementById('btnBack');
    const duplicateCheckResult = document.getElementById('duplicateCheckResult');

    const photoData = sessionStorage.getItem('currentPhoto');
    if (photoData) {
      image.src = photoData;
      checkForDuplicates();
    } else {
      console.warn('currentPhoto が見つかりません');
      alert('画像情報がありません。再度写真を選択してください。');
      location.href = 'add_photo.html';
    }

    // async関数に変更
    btnSave.onclick = async () => {
      const name = nameInput.value.trim();
      const desc = descInput.value.trim();

      if (!photoData || !name || !desc) {
        alert('名前と説明を入力してください');
        return;
      }

      const zukanId = localStorage.getItem('currentZukanId');
      if (!zukanId) {
        alert('図鑑が選択されていません');
        return;
      }

      try {
        // 新しい写真のハッシュ値を計算
        const newImageHash = await pHash.hash(image);

        // 位置情報を取得し、写真オブジェクトを作成
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const photo = { id: Date.now().toString(), image: photoData, name: name, description: desc, lat: lat, lng: lng, hash: newImageHash.toBinary() };
            addPhotoToZukan(zukanId, photo);
            sessionStorage.removeItem('currentPhoto');
            location.href = 'complete.html';
          }, (err) => {
            alert("位置情報を取得できませんでした");
            const photo = { id: Date.now().toString(), image: photoData, name: name, description: desc, lat: null, lng: null, hash: newImageHash.toBinary() };
            addPhotoToZukan(zukanId, photo);
            sessionStorage.removeItem('currentPhoto');
            location.href = 'complete.html';
          });
        } else {
          alert("この端末では位置情報が使えません");
          const photo = { id: Date.now().toString(), image: photoData, name: name, description: desc, lat: null, lng: null, hash: newImageHash.toBinary() };
          addPhotoToZukan(zukanId, photo);
          sessionStorage.removeItem('currentPhoto');
          location.href = 'complete.html';
        }

      } catch (error) {
        console.error('写真登録時にハッシュ値の計算に失敗しました:', error);
        alert('画像の処理中にエラーが発生しました。');
      }
    };

    btnBack.onclick = () => {
      location.href = 'add_photo.html';
    };

    function getZukans() {
      const json = localStorage.getItem('zukans');
      return json ? JSON.parse(json) : [];
    }

    function saveZukans(zukans) {
      localStorage.setItem('zukans', JSON.stringify(zukans));
    }

    function addPhotoToZukan(zukanId, photo) {
      const zukans = getZukans();
      const zukanIndex = zukans.findIndex(zukan => zukan.id === zukanId);
      if (zukanIndex !== -1) {
        if (!zukans[zukanIndex].photos) {
          zukans[zukanIndex].photos = [];
        }
        zukans[zukanIndex].photos.push(photo);
        saveZukans(zukans);
      } else {
        console.error('指定された図鑑が見つかりません');
      }
    }

    async function checkForDuplicates() {
        const currentImage = document.getElementById('displayImage');
        if (!currentImage.src) return;

        try {
            // 新しい画像のハッシュを計算
            const newImageHash = await pHash.hash(currentImage);
            const newHashBinary = newImageHash.toBinary();

            // 全ての図鑑から過去の写真をチェック
            const allZukans = getZukans();
            let duplicateFound = false;

            for (const zukan of allZukans) {
                if (zukan.photos) {
                    for (const photo of zukan.photos) {
                        // ハッシュ値が保存されているか確認
                        if (photo.hash) {
                           // ハッシュを比較し、類似度を計算（ハミング距離）
                           const distance = HammingDistance(newHashBinary, photo.hash);
                           // 距離が小さいほど類似している。ここでは10を閾値とする。
                           if (distance <= 10) {
                               // 重複と見なす
                               const userConfirmation = confirm(`この写真は、すでに登録済みの「${photo.name}」に似ているようです。\n\n「${photo.name}」の情報を自動入力しますか？`);
                               if (userConfirmation) {
                                   nameInput.value = photo.name;
                                   descInput.value = photo.description;
                               }
                               duplicateFound = true;
                               break; 
                           }
                        }
                    }
                }
                if(duplicateFound) break;
            }
            if (!duplicateFound) {
              duplicateCheckResult.textContent = '過去に登録した写真との重複は見つかりませんでした。';
              duplicateCheckResult.style.color = 'green';
            }
        } catch (error) {
            console.error('重複チェック中にエラーが発生しました:', error);
            duplicateCheckResult.textContent = '重複チェックに失敗しました。';
            duplicateCheckResult.style.color = 'red';
        }
    }
  </script>
</body>
</html>
